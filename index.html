ction: column;

      <script>
            const stagesData = [
              {
                        title: "Leads de Entrada",
                        subtitle: "Seja a porta de entrada de TODOS os novos leads comerciais",
                        guidance: "Entrou lead entra aqui. O vendedor deve assumir rapidamente.",
                        tips: "Lead vindo de anuncio\nPessoa chamou pelo Instagram\nLead da OLX\nIndicacao\nQuero saber o preco do produto",
                        responses: [
                                    "Ola! Tudo bem? Sou da Revend. Como posso te ajudar?",
                                    "Oi! Vi seu interesse. Posso conversar com voce agora?",
                                    "Ola! Qual produto voce esta interessado?"
                                  ],
                        checklist: [
                                    "Capturou o lead",
                                    "Registrou no Kommo",
                                    "Iniciou conversa"
                                  ]
              },
              {
                        title: "Primeiro Contato",
                        subtitle: "Registre que o vendedor JA INICIOU A ABORDAGEM",
                        guidance: "Abrir a conversa e descobrir: nome, produto desejado, se ja eh cliente, como conheceu.",
                        tips: "Descobrir nome do cliente\nQual produto quer\nSe ja eh cliente\nComo conheceu",
                        responses: [

                                    "[NOME], me conta um pouco mais sobre o que voce esta procurando?"
                                  ],
                        checklist: [
                                    "Descobriu o nome",
                                    "Identificou o produto",
                                    "Perguntou se eh cliente",
                                    "Registrou na qualificacao"
                                  ]
              },
              {
                        title: "Qualificacao",
                        subtitle: "Descobrir O QUE REALMENTE PRECISA SER VENDIDO",
                        guidance: "Definir: Produto, Modelo, Capacidade, Condicao, Forma de Pagamento, Troca.",
                        tips: "Precisa saber:\niPhone, iPad, MacBook, AirPods...\nModelo (14, 15, 15 Pro Max...)\nCapacidade (128GB, 256GB, 512GB, 1TB)\nCondicao (Lacrado, Open Box, Seminovo)\nPagamento (Pix, Cartao, Dinheiro, Crediario)\nTroca (Possui aparelho? Estado?)",
                        responses: [
                                    "Qual modelo voce esta procurando exatamente? (Ex: iPhone 15 Pro Max)",
                                    "E quanto a capacidade? Voce prefere 256GB ou 512GB?",
                                    "Voce tem um aparelho antigo para fazer troca? Qual eh o modelo?",
                                    "Como voce prefere pagar? Pix, cartao ou em parcelas?"
                                  ],
                        checklist: [
                                    "Definiu o produto",
                                    "Escolheu modelo",
                                    "Definiu capacidade",
                                    "Escolheu condicao",
                                    "Definiu forma de pagamento",
                                    "Perguntou sobre troca"
                                  ]
              },
              {
                        title: "Proposta Enviada",
                        subtitle: "Cliente JA RECEBEU UMA OFERTA CONCRETA",
                        guidance: "Vendedor precisa acompanhar. Cliente esta com proposta 'na mao'.",
                        tips: "Exemplo:\niPhone 17 Pro Max 256 GB | Open Box\nR$ X no Pix | Ate X vezes cartao\nGarantia de X meses | Carregador incluso\nTroca: R$ X | Diferenca: R$ X",
                        responses: [
                                    "Seguinte, [NOME]:\n[PRODUTO] [CAPACIDADE]\nR$ [PRECO] no Pix\nOu ate 12x de R$ [VALOR]\nGarantia de 12 meses\nTroca do seu [APARELHO ANTIGO] por R$ [VALOR]\n\nE ai, te agrada?",
                                    "[NOME], te enviei a proposta completa via mensagem. Da uma olhada e depois a gente conversa sobre os detalhes.",
                                    "Ja calculei tudo para voce. Com a troca do seu aparelho, ficaria em R$ [VALOR]. Quer fechar?"
                                  ],
                        checklist: [
                                    "Calculou corretamente",
                                    "Enviou proposta clara",
                                    "Incluiu garantia",
                                    "Informou troca",
                                    "Acompanhando resposta"
                                  ]
              },
              {
                        title: "Negociacao",
                        subtitle: "UMA DAS ETAPAS MAIS IMPORTANTES - Cliente com ALTA INTENCAO",
                        guidance: "Clientes que voce NAO PODE DEIXAR ESCAPAR. Trabalhar objecoes e urgencia.",
                        tips: "Cliente dizendo:\n'Tem como melhorar o preco?'\n'Se eu der meu aparelho, quanto fica?'\n'Vou passar ai'\n'Se fizer por X eu fecho'\n\nREGRA: Nenhum cliente sem PROXIMA ACAO",
                        responses: [
                                    "[NOME], sobre o preco: esse valor ja tem a maxima reducao que consigo. Mas posso aumentar bastante o valor da sua troca. Deixa eu verificar.",
                                    "Otimo, [NOME]! Voce vem ai amanha? Qual horario te funciona melhor?",
                                    "Ah [NOME], se voce fechar HOJE via Pix, dou mais R$ 50 de desconto. Combina?",
                                    "Entendo sua preocupacao com o preco. Mas olha so: voce ganha [BENEFICIO]. Vale MUITO a pena."
                                  ],
                        checklist: [
                                    "Descobriu objecao principal",
                                    "Trabalhou preco/troca",
                                    "Apresentou beneficios",
                                    "Criou urgencia",
                                    "Agendou proximo passo"
                                  ]
              },
              {
                        title: "Aguardando Pagamento",
                        subtitle: "Cliente esta PRATICAMENTE FECHADO - So falta o dinheiro",
                        guidance: "NAO eh venda ganha. VENDA EH GANHA QUANDO PAGAMENTO CONFIRMADO.",
                        tips: "Cliente dizendo:\n'Vou fazer o Pix'\n'Estou esperando cartao virar'\n'Vou transferir daqui a pouco'\n'Faco pagamento na loja'\n'Meu limite libera amanha'",
                        responses: [
                                    "[NOME], otimo! Fico aqui te aguardando. Eh so me chamar quando fizer o Pix, ta?",
                                    "Sem problemas! Quando seu cartao virar, eh so me avisar que a gente finaliza tudo.",
                                    "Perfeito! Qual horario voce vem retirar o aparelho? Deixa eu anotar para reservar.",
                                    "Combina assim: me avisa quando o Pix cair que eu ja separo tudo pra voce!"
                                  ],
                        checklist: [
                                    "Confirmou intencao",
                                    "Registrou metodo de pagamento",
                                    "Combinou prazo",
                                    "Ficou de acompanhar",
                                    "Pronto para faturar"
                                  ]
              },
              {
                        title: "Cliente Agendado",
                        subtitle: "Cliente combinou acao PRESENCIAL",
                        guidance: "Vai a loja, vai avaliar aparelho, vai retirar, vai fazer troca.",
                        tips: "Automacao ideal:\n24h ANTES: Confirmar nosso horario amanha\n2-3H ANTES: Tudo certo para nosso horario hoje?\n\nNunca deixe cliente agendado desaparecer!",
                        responses: [
                                    "Perfeito, [NOME]! Ta marcado para [DIA] as [HORA] aqui na loja. Combinado?",
                                    "[NOME], so confirmar: amanha as [HORA] voce vem ai pra gente finalizar, certo?",
                                    "Otimo! Ja separei tudo para voce. So falta voce vir buscar. Reconfirma se consegue vir hoje?"
                                  ],
                        checklist: [
                                    "Agendou presencial",
                                    "Confirmou data/hora",
                                    "Enviou endereco",
                                    "24h antes: confirmar",
                                    "2-3h antes: confirmar novamente"
                                  ]
              },
              {
                        title: "Ganho",
                        subtitle: "Ciclo comercial encerrado com SUCESSO",
                        guidance: "Quando: Pagamento confirmado + Venda realizada.",
                        tips: "Pos-venda:\nD+1: Satisfacao\nD+7: Experiencia\nD+30: Acessorios\nD+90: Indicacao\n\nGanhe referencias!",
                        responses: [
                                    "Valeu, [NOME]! Seu [PRODUTO] ja esta pronto! Aproveita bem!",
                                    "[NOME], que legal ter trabalhado com voce! Qualquer duvida com o produto, eh so chamar!",
                                    "Sucesso demais! Sua compra foi aprovada. Ja eh seu agora!"
                                  ],
                        checklist: [
                                    "Faturamento confirmado",
                                    "Produto entregue",
                                    "Satisfacao do cliente",
                                    "Registrou como GANHO",
                                    "Programou follow-up D+1"
                                  ]
              },
              {
                        title: "Perdido",
                        subtitle: "Oportunidade sem venda naquele ciclo",
                        guidance: "REGISTRE O MOTIVO: Preco / Concorrente / Sem dinheiro / Nao respondeu / Indisponivel",
                        tips: "Analise do motivo:\nPreco: Trabalhar melhor\nConcorrente: Melhorar oferta\nSem dinheiro: Follow-up em 30 dias\nNao respondeu: Tentar 3x depois desistir\nIndisponivel: Deixar para depois",
                        responses: [
                                    "[NOME], entendo sua posicao. Fico a disposicao quando mudar de ideia. Abraco!",
                                    "Tudo bem, [NOME]! Se em breve mudar de ideia, eh so chamar!",
                                    "Beleza! Deixa eu registrar isso aqui. Talvez no futuro a gente feche junto!"
                                  ],
                        checklist: [
                                    "Registrou motivo da perda",
                                    "Anotou o motivo no Kommo",
                                    "Deixou porta aberta para futura venda",
                                    "Nao insistiu demais",
                                    "Passou para proxima oportunidade"

                  ];

            function renderStage(stageIndex) {
                    const stage = stagesData[stageIndex];
                    const title = document.getElementById('coachingTitle');
                    const subtitle = document.getElementById('coachingSubtitle');
                    const body = document.getElementById('coachingBody');

                    title.textContent = stage.title;
                    subtitle.textContent = stage.subtitle;

                    let html = '';

                    html += `
                            <div class="card guidance-card">
                                      <div class="card-title">Objetivo</div>
                                                <div class="card-content">${stage.guidance}</div>
                                                        </div>
                                                              `;

                    html += `
                            <div class="card tip-card">
                                      <div class="card-title">Pontos Importantes</div>
                                                <div class="card-content">${stage.tips}</div>
                                                        </div>
                                                              `;

                    html += `
                            <div class="card">
                                      <div class="card-title">Respostas Prontas</div>
                                                <div class="card-content">
                                                      `;

                    stage.responses.forEach((response, idx) => {
                              html += `
                                        <div style="margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #E2E8F0;">
                                                    <div style="margin-bottom: 6px; padding: 8px; background: #F9FAFB; border-radius: 4px; font-size: 11px; white-space: pre-wrap;">"${response}"</div>
                                                                <button class="copy-btn" onclick="copyText('${response}', this)">Copiar</button>
                                                                          </div>
                                                                                  `;
                    });

                    html += `
                              </div>
                                      </div>
                                            `;

                    html += `
                            <div class="card check-card">
                                      <div class="card-title">Checklist da Etapa</div>
                                                <div>
                                                      `;

                    stage.checklist.forEach((item, idx) => {
                              html += `
                                        <div class="checklist-item">
                                                    <input type="checkbox" id="check-${stageIndex}-${idx}">
                                                                <label for="check-${stageIndex}-${idx}">${item}</label>
                                                                          </div>
                                                                                  `;
                    });

                    html += `
                              </div>
                                      </div>
                                            `;

                    body.innerHTML = html;

                    document.querySelectorAll('.stage-btn').forEach((btn, idx) => {
                              btn.classList.toggle('active', idx === stageIndex);
                    });
            }

            function copyText(text, button) {
                    navigator.clipboard.writeText(text).then(() => {
                              button.classList.add('copied');
                              button.textContent = 'Copiado!';
                              setTimeout(() => {
                                          button.classList.remove('copied');
                                          button.textContent = 'Copiar';
                              }, 2000);
                    });
            }

            document.querySelectorAll('.stage-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                              const stageIndex = parseInt(btn.dataset.stage);
                              renderStage(stageIndex);
                    });
            });

            renderStage(0);
      </script>

      </script>
